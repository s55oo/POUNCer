[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pouncer"
version = "0.7.84"
description = "Follows your N1MM Logger+ frequency and shows S53WW RBN spots for that band"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pouncer = "pouncer.__main__:main"

[tool.setuptools]
packages = ["pouncer"]
