; POUNCer configuration
; ---------------------------------------------------------------------------
; General layout:
;   [rbn]    Reverse Beacon Network (spot source)
;   [n1mm]   N1MM Logger+ network interface (radio info + control)
;   [worked] Read the N1MM log to hide already-worked callsigns
;   [ui]     Display behaviour (incl. TX / log buttons)
;   [web]    Local web / phone view
;
; N1MM side setup (do this once in N1MM Logger+):
;   Config > Config Ports... > Broadcast Data tab
;     - tick "Radio"
;     - set the destination address to  127.0.0.1:12060
;   Control (QSY / callsign) is sent to UDP port 13064 by default, no
;   N1MM setting is required for that direction.

[rbn]
; RBN telnet server (port 7000 serves CW/RTTY spots).
host = telnet.reversebeacon.net
port = 7000

; Your callsign, sent to RBN for login. Leave it commented out to use the
; call N1MM has ([Packet] Logon Callsign, else the Entry Window operator in
; N1MM Logger.ini); set it here only to use a different one.
;callsign = S55OO

; Server-side skimmer/node to keep. Only spots spotted by a node whose name
; starts with this string are shown. S53WW is the default.
spotter = S53WW

; Modes to follow (comma separated). Only spots in these modes are shown.
; Valid: CW, RTTY, FT8, FT4. CW/RTTY come from port 7000, FT8/FT4 from
; ft8_port below. Default CW only.
follow_modes = CW
ft8_port = 7001

; Country file used to mark DX spots (outside your own continent, e.g. not
; EU for S5): their callsign is shown in yellow, EU calls in white. Leave
; blank to use the one N1MM keeps updated:
;   Documents\N1MM Logger+\SupportFiles\wl_cty.dat
cty =

; Hide beacon spots (RBN type BEACON / NCDXF, or calls ending in /B).
hide_beacons = true

[n1mm]
; Where we listen for N1MM RadioInfo broadcasts (UDP). Use 0.0.0.0 so both
; 127.0.0.1 and subnet broadcasts are received.
listen_ip = 0.0.0.0
listen_port = 12060

; Where we send control packets (QSY and callsign entry) to N1MM.
control_ip = 127.0.0.1
control_port = 13064

; Radio number to QSY (1 = main radio; 2 = second radio / VFO B).
radionr = 1

; Clicking a spot also types the callsign into the N1MM Entry Window.
; This action only types the callsign - it never transmits (the optional TX
; buttons under [ui] fkeys are separate, explicit actions).
set_callsign = true

; Wipe the callsign box before typing the new callsign.
wipe_before_call = true

; Bring the N1MM Logger+ Entry Window to the foreground when a spot is
; clicked, so the typed callsign lands in the callsign box.
focus_n1mm = true

; Optional path to N1MM Logger.ini. Leave blank to auto-detect it in the
; standard location (Documents\N1MM Logger+).
ini =

[worked]
; Path to an N1MM .s3db log to use as the "worked" reference. Leave blank to
; automatically use the log N1MM currently has open (read from N1MM Logger.ini).
db =

; Hide spots whose callsign is already worked on the same band AND mode.
hide = true

; How often (seconds) to re-check which log/contest N1MM has open. Newly logged
; QSOs are picked up almost immediately (every ~0.5 s) regardless of this value.
refresh_seconds = 10

[ui]
; Initial sort column shown at startup (see up/down arrows in the column
; headings - click any heading to sort by that column, click again to
; reverse). Valid values: time, freq, snr, wpm, call, mode, type, spotter.
sort = snr

; Drop spots that have not been re-spotted within this many minutes.
max_age_minutes = 10

; What triggers a QSY when clicking a spot: single or double.
trigger = single

; Big-button touch view for a touch screen (e.g. a second 1080p monitor).
; Set true to open it automatically at startup; the "Touch view" button in the
; main window toggles it any time. Tiles are ordered strongest SNR first,
; filled top-to-bottom, in at most two columns (touch_columns is clamped to 2).
; touch_rows = how many spots fit per column.
; touch_font = tile text size in points.
touch_view = false
touch_columns = 2
touch_rows = 8
touch_font = 26

; Function-key (TX) and Enter buttons, as KEY[:label], comma/space separated.
; They appear in the main window, on the touch board and on the phone page, and
; are always available. An F-key (F1-F12) presses that key in the focused N1MM
; Entry Window, which SENDS THAT MESSAGE OVER THE AIR (unlike tapping a spot
; tile, which never transmits); F4 is normally the {MYCALL} message. "Enter"
; logs the QSO in N1MM (no transmission). e.g. "F1:CQ F2:Exch F3:TU F4:MyCall
; Enter"; leave blank to hide the buttons.
fkeys = F2:RPRT F3:TU F4:CALL F5:HisCALL F7:? Enter

; Footer buttons on the phone page: move the VFO down / up by this many Hz
; (via N1MM, like a spot click), and WPM - / WPM + which press PgDn / PgUp
; in the Entry Window (N1MM's CW speed step, set in its Configurer).
tune_step_hz = 25

; RX filter width (footer NAR / WIDE) the radio is in when POUNCer starts.
; N1MM only has a wide/narrow toggle (Alt+'), so POUNCer can't read it and
; starts from this: narrow (usual for CW) or wide; empty = unknown. If the
; lit button doesn't match the radio, hold either button 1 s to resync.
filter_start = narrow

; NAR / WIDE as CAT commands (better than the toggle: they SET the filter,
; so the buttons can't get reversed). Sent through N1MM to the radio as
; {CAT1ASC ...}; both empty = use N1MM's Alt+' toggle instead.
; FLEX-6000 (SmartSDR CAT): ZZFInn; picks filter preset nn = 00 (widest)
; .. 07 (narrowest) of the current mode - the 8 filter buttons in SmartSDR.
; Kenwood-style radios: e.g. FW0250; / FW0500;
filter_narrow_cat = ZZFI05;
filter_wide_cat = ZZFI02;

; Run history: how often each spotted station RUNS (calls CQ), from its
; past logs in S53ZO's public contest-log archive on GitHub (same contest
; and mode, newest log). Shown on the phone tiles as R81% (81% of its
; QSOs made running); a lightning mark = runs under 30%, so a CQ from it
; won't last - work it now. Downloaded once per call into a "cache" folder
; next to this file. false = off (no internet use).
run_history = true
; Optional run list server (server/runlist.py in Docker, e.g. on ZeroTier):
; the whole contest list is loaded at once, so calls are known before they
; are spotted. Calls it doesn't know still come from GitHub. Empty = off.
; Example: run_server = http://10.147.17.5:8077
run_server =

[web]
; Phone/browser view: a small local web server that shows the same needed
; spots (SNR order, big tap tiles) and lets you tap one to QSY + enter the
; call, exactly like the touch view. Open it from a phone at
;   http://<this-pc-ip>:<port>
; (the app shows the exact URL in its status bar). Bind to 0.0.0.0 so it works
; over your LAN - and over ZeroTier/VPN, which handles remote access for you.
enabled = true
host = 0.0.0.0
port = 8080
