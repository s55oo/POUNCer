; POUNCer configuration
; ---------------------------------------------------------------------------
; General layout:
;   [rbn]    Reverse Beacon Network (spot source)
;   [n1mm]   N1MM Logger+ network interface (radio info + control)
;   [worked] Read the N1MM log to hide already-worked callsigns
;   [ui]     Display behaviour (incl. TX / log buttons)
;   [web]    Local web / phone view
;
; N1MM side setup (do this once in N1MM Logger+):
;   Config > Config Ports... > Broadcast Data tab
;     - tick "Radio"
;     - set the destination address to  127.0.0.1:12060
;   Control (QSY / callsign) is sent to UDP port 13064 by default, no
;   N1MM setting is required for that direction.

[rbn]
; RBN telnet server (port 7000 serves CW/RTTY spots).
host = telnet.reversebeacon.net
port = 7000

; Your callsign, sent to RBN for login. Leave it commented out to use the
; call N1MM has ([Packet] Logon Callsign, else the Entry Window operator in
; N1MM Logger.ini); set it here only to use a different one.
;callsign = S55OO

; Server-side skimmer/node to keep. Only spots spotted by a node whose name
; starts with this string are shown. S53WW is the default.
spotter = S53WW

; At start (and after a reconnect) ask RBN for the last spots (SH/DX) so the
; list has stations to click right away: first those of your skimmer
; ("sh/dx/100 spotter=S53WW-#"), and if that gives nothing "sh/dx/30".
; Old ones fade / expire as usual. 0 = off.
history = 30

; Backup telnet server when RBN's own telnet is down: used after RBN failed
; twice in a row or sent no spots for 2 minutes; RBN is tried again every
; 10 minutes. It must pass on the RBN skimmer spots ("DX de S53WW-#: ...").
; backup_commands = sent after login, comma separated (e.g. set/skimmer).
; Empty backup_host = no backup.
backup_host = azure.s53m.com
backup_port = 8000
backup_commands =

; Backup: if that skimmer sends nothing for backup_after_minutes (offline?),
; spots from other skimmers are used until it is back - the ones listed in
; backup_spotters (call prefixes, e.g. OE9GHV, S50ARX) or, if empty, every
; skimmer on your own continent. One tile per station either way.
backup_spotters =
backup_after_minutes = 5

; Modes to follow (comma separated). Only spots in these modes are shown.
; Valid: CW, RTTY, FT8, FT4. CW/RTTY come from port 7000, FT8/FT4 from
; ft8_port below. Default CW only.
follow_modes = CW
ft8_port = 7001

; Country file used to mark DX spots (outside your own continent, e.g. not
; EU for S5): their callsign is shown in yellow, EU calls in white. Leave
; blank to use the one N1MM keeps updated:
;   Documents\N1MM Logger+\SupportFiles\wl_cty.dat
cty =

; Hide beacon spots (RBN type BEACON / NCDXF, or calls ending in /B).
hide_beacons = true

[n1mm]
; Where we listen for N1MM RadioInfo broadcasts (UDP). Use 0.0.0.0 so both
; 127.0.0.1 and subnet broadcasts are received.
listen_ip = 0.0.0.0
listen_port = 12060

; Where we send control packets (QSY and callsign entry) to N1MM.
control_ip = 127.0.0.1
control_port = 13064

; Radio number to QSY (1 = main radio; 2 = second radio / VFO B).
radionr = 1

; SO2R / SO2V: which radio a tap, the F-keys and the band follow go to at
; start - A (radio 1, N1MM's Entry Window A) or B (radio 2, Entry Window B).
; Switch any time with the A / B button (phone page: per phone; main window).
; Empty = radionr above. With one radio only A is used, as before.
default_radio = A

; SO2R: how radio B is QSYed. type = POUNCer types the frequency (kHz) into
; Entry Window B and presses Enter - N1MM then moves radio B (the UDP QSY
; command moved radio A in SO2R). udp = N1MM's UDP QSY command (radio 2).
; Radio A always uses the UDP command.
radio_b_qsy = type

; Decimal sign of that typed frequency. N1MM reads it with the Windows
; number format: on a Slovenian PC "14000.1" became 140001 kHz. auto = the
; Windows setting (","), or force "." / ",".
freq_decimal = auto

; SO2R / SO2V: after a tap (or -/+ Hz) for the OTHER radio, put the cursor
; back where it was - the same Entry Window and the same box (callsign,
; exchange, ...) with the same cursor position - so you go on typing there.
; false = stay in the other radio's Entry Window.
return_focus = true

; After a tap POUNCer waits until N1MM reports the radio on the new
; frequency (at most qsy_wait_ms), then qsy_settle_ms more, and only then
; wipes the Entry Window and types the call - N1MM can clear the callsign
; when the radio moves, so typing too early lost the call. Then it checks
; the callsign box and types the call again if it isn't there.
; SO2R radio B: if N1MM's report comes later than that, POUNCer keeps the
; call in the box 1 s longer and puts it in again if N1MM wiped it.
qsy_wait_ms = 1500

; How the call gets into N1MM's box (radio B's frequency is always typed):
; settext = put in in one go (nothing can get mixed up on a slow PC),
; keys = typed key by key as before (if N1MM ever doesn't react to settext).
type_mode = settext
qsy_settle_ms = 250

; Clicking a spot also types the callsign into the N1MM Entry Window.
; This action only types the callsign - it never transmits (the optional TX
; buttons under [ui] fkeys are separate, explicit actions).
set_callsign = true

; Wipe the callsign box before typing the new callsign.
wipe_before_call = true

; Bring the N1MM Logger+ Entry Window to the foreground when a spot is
; clicked, so the typed callsign lands in the callsign box.
focus_n1mm = true

; Optional path to N1MM Logger.ini. Leave blank to auto-detect it in the
; standard location (Documents\N1MM Logger+).
ini =

[worked]
; Path to an N1MM .s3db log to use as the "worked" reference. Leave blank to
; automatically use the log N1MM currently has open (read from N1MM Logger.ini).
db =

; Hide spots whose callsign is already worked on the same band AND mode.
hide = true

; How often (seconds) to re-check which log/contest N1MM has open. Newly logged
; QSOs are picked up almost immediately (every ~0.5 s) regardless of this value.
refresh_seconds = 10

[ui]
; Initial sort column shown at startup (see up/down arrows in the column
; headings - click any heading to sort by that column, click again to
; reverse). Valid values: time, freq, snr, wpm, call, mode, type, spotter.
sort = snr

; Drop spots that have not been re-spotted within this many minutes.
max_age_minutes = 10

; What triggers a QSY when clicking a spot: single or double.
trigger = single

; Big-button touch view (touch screen, second monitor): the phone page in
; the default browser - the "Open in browser" button in the main window opens
; it any time. true = also open it automatically at startup.
touch_view = false

; Function-key (TX) and Enter buttons, as KEY[:label], comma/space separated.
; They appear in the main window and on the phone / browser page, and
; are always available. An F-key (F1-F12) presses that key in the focused N1MM
; Entry Window, which SENDS THAT MESSAGE OVER THE AIR (unlike tapping a spot
; tile, which never transmits); F4 is normally the {MYCALL} message. "Enter"
; logs the QSO in N1MM (no transmission). e.g. "F1:CQ F2:Exch F3:TU F4:MyCall
; Enter"; leave blank to hide the buttons.
fkeys = F2:RPRT F3:TU F4:CALL F5:HisCALL F7:? Enter

; Footer buttons on the phone page: move the VFO down / up by this many Hz
; (via N1MM, like a spot click), and WPM - / WPM + which press PgDn / PgUp
; in the Entry Window (N1MM's CW speed step, set in its Configurer).
tune_step_hz = 25

; Phone: a tile fades when its station hasn't been re-spotted this long
; (probably stopped calling there).
fade_minutes = 5

; Run history: how often each spotted station RUNS (calls CQ), from its
; past logs in S53ZO's public contest-log archive on GitHub (same contest
; and mode, last 6 years). Shown on the phone tiles as R81% (81% of its
; QSOs made running) and hours on the air (R81% 23h; * = reconstructed log);
; a lightning mark = runs under 30% or on under 6 h, so a CQ from it won't
; last - work it now. Downloaded once per call into a "cache" folder
; next to this file. false = off (no internet use).
run_history = true
; Warm-up: at start download (once, refreshed after 30 days) the ready run
; history of ~46 000 stations from CQWW CW, ARRL DX CW and CQ WPX CW and,
; as a separate list, of their SSB versions (CQWW / ARRL DX / CQ WPX SSB),
; last 5 years, into the cache folder, so they are known before spotted.
; false = off.
warmup = true
; Auto-update (POUNCer.exe only): at start and every 6 h look for a newer
; release on GitHub, download it and check its SHA-256; it is used from the
; next start (or press "Restart" next to the lights). Never restarts by
; itself. false = off.
auto_update = true
; F1-F12 pressed on the keyboard while the POUNCer window is active go to
; N1MM: POUNCer brings N1MM's Entry Window to the front and presses the
; same key there, so that N1MM message is SENT (transmits). Enter too when
; it is one of the fkeys below (logs the QSO). false = off.
forward_fkeys = true
; Optional run list server (server/runlist.py in Docker, e.g. on ZeroTier):
; the whole contest list is loaded at once, so calls are known before they
; are spotted. Calls it doesn't know still come from GitHub. Empty = off.
; Example: run_server = http://10.147.17.5:8077
run_server =
; Ready-made run list file (no server, no download): runlist.sqlite built
; by server/runlist.py (CQWW CW+SSB, 2023-2025, 47 879 logs). Put it next
; to this file. Missing file = ignored.
run_list = runlist.sqlite

[web]
; Phone/browser view: a small local web server that shows the same needed
; spots (SNR order, big tap tiles) and lets you tap one to QSY + enter the
; call. Open it from a phone at
;   http://<this-pc-ip>:<port>
; (the app shows the exact URL in its status bar). Bind to 0.0.0.0 so it works
; over your LAN - and over ZeroTier/VPN, which handles remote access for you.
enabled = true
host = 0.0.0.0
port = 8080

; Settings page (/settings): change the most-used settings in the browser;
; they are written into this file. false = only from the browser on this PC
; (http://127.0.0.1:8080/settings), true = also from a phone / other PC.
remote_settings = false

[ssb]
; SSB contests. RBN skimmers don't decode SSB, so SSB spots come from a DX
; cluster (human spots). With follow_radio_mode the list follows the radio:
; on USB / LSB it shows SSB spots, on CW the RBN CW spots - per radio (A / B).
; mode = auto: connect to the cluster when a radio is on SSB (and on a team
;        master, for the others); always; off.
; spotters = EU: only spots from spotters in Europe (likely workable);
;            NA, AS, ... or ALL.
; login = the call sent to the cluster (empty = your call; add e.g. -2 if
;         the cluster already has you logged in as the RBN backup).
; commands = sent after login, comma separated.
mode = auto
host = azure.s53m.com
port = 8000
spotters = EU
history = 30
login =
commands =
follow_radio_mode = true

[team]
; Several POUNCers on the same network (e.g. one per band / PC) find each
; other and work as a team: the one running longest (with a working RBN
; connection) is the master and alone talks to RBN, passing the spots to
; the others; run history learned by one is shared with all, so each call
; is downloaded only once. If the master stops, the next takes over.
; UDP broadcast on this port (allow it in the Windows firewall on all PCs).
enabled = true
port = 12079
; They find each other on every network adapter (LAN, ZeroTier, ...). If a
; network drops broadcasts, list the other POUNCer PCs here, e.g.
; peers = 10.147.17.5, 10.147.17.8
peers =
