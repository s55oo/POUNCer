name: Build POUNCer (Windows and macOS)

# Builds the standalone exe on a clean GitHub Windows runner, with the
# PyInstaller bootloader compiled from source (the prebuilt one is what
# antivirus engines fingerprint - Trojan:Win32/Wacatac.B!ml false positives).
# Same approach as s55oo/N1MM_callbook (Callbooker 1.11).
# Result: the "POUNCer" artifact of the run (POUNCer.exe + config.ini).
# Pushing a tag v* also publishes a GitHub Release with both files and the
# exe's SHA-256 in the notes (Releases page = the download link to share).
# macOS builds use the same spec and ship the executable plus config.ini in
# tar.gz archives, preserving the executable permission for each architecture.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with this tag (e.g. v0.2.0); blank = build only"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write   # only used by the release step on v* tags

env:
  PYINSTALLER_VERSION: "6.22.2"

jobs:
  # The phone page's QR code, decoded by a real QR reader (OpenCV): it must
  # read back exactly the address, or nothing is built / released.
  qr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: QR code decodes back to the address
        env:
          POUNCER_QR_DECODE: "1"
        run: |
          python -m pip install opencv-python-headless numpy
          python -m unittest -v tests.test_qr

  build:
    needs: qr-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # POUNCer is stdlib-only, so there are no runtime dependencies.
      - name: Tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2> test-out.txt
          rc=$?
          cat test-out.txt
          # failing tests as annotations (readable without the full log)
          grep -E "^(ERROR|FAIL):" test-out.txt | head -10 | sed 's/^/::error::/'
          grep -E "^[A-Za-z]*(Error|Exception):|^AssertionError" test-out.txt | head -10 | sed 's/^/::error::/'
          exit $rc

      # The Windows window layout (buttons flow onto more rows, text wraps)
      # checked on a real Tk window; the result goes into the release notes.
      - name: Window layout test (real Tk)
        run: |
          python -m unittest -v tests.test_tk_layout 2> tk-test.txt
          $code = $LASTEXITCODE
          Get-Content tk-test.txt
          exit $code

      # Screenshots of the window (both layouts) on real Windows - checked
      # before a release; never fails the build.
      - name: Window screenshots
        continue-on-error: true
        run: |
          python -m pip install pillow
          python tests/ci_screenshots.py screenshots
          python tests/ci_hamqth_check.py screenshots/hamqth-check.txt

      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore

      # ... and on the pre-release "screenshots" (replaced each build; the
      # updater follows only the latest real release, never this one)
      - name: Publish screenshots
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          ls screenshots/*.txt >/dev/null 2>&1 && gh release upload screenshots screenshots/*.txt --clobber || true
          gh release view screenshots >/dev/null 2>&1 || gh release create screenshots \
            --prerelease --target "$GITHUB_SHA" --title "Window screenshots (built by CI)" \
            --notes "Screenshots of the POUNCer window on Windows with made-up spots, taken by every build. Not a POUNCer version - see the latest release for that."
          gh release upload screenshots screenshots/*.png --clobber

      # PyInstaller's own deps first, then PyInstaller itself from the sdist:
      # pip compiles the bootloader with the runner's MSVC.
      - name: Install PyInstaller (bootloader compiled from source)
        run: |
          python -m pip install altgraph packaging pefile pyinstaller-hooks-contrib pywin32-ctypes setuptools
          python -m pip install --no-binary pyinstaller --no-deps "pyinstaller==$env:PYINSTALLER_VERSION"
          python -m PyInstaller --version

      - name: Build
        run: |
          python -m PyInstaller --noconfirm POUNCer.spec
          python -m PyInstaller --noconfirm N1MMautostarter.spec
          Copy-Item config.ini dist\config.ini

      - name: SHA-256
        run: |
          $h = (Get-FileHash dist\POUNCer.exe -Algorithm SHA256).Hash
          "SHA-256 $h"
          "**POUNCer.exe** SHA-256: ``$h``" >> $env:GITHUB_STEP_SUMMARY
          $a = (Get-FileHash dist\N1MMautostarter.exe -Algorithm SHA256).Hash
          "N1MMautostarter SHA-256 $a"
          "**N1MMautostarter.exe** SHA-256: ``$a``" >> $env:GITHUB_STEP_SUMMARY

      # Informational: does Defender flag the fresh build? Never fails the job.
      - name: Defender scan
        continue-on-error: true
        run: |
          Start-MpScan -ScanType CustomScan -ScanPath "$PWD\dist\POUNCer.exe"
          Start-MpScan -ScanType CustomScan -ScanPath "$PWD\dist\N1MMautostarter.exe"
          $t = Get-MpThreatDetection
          if ($t) { $t | Format-List ThreatID, Resources; "Defender flagged the build" } else { "Defender: clean" }

      # Release: on a pushed v* tag, or when "Run workflow" is given a tag.
      # In the second case the tag is created here, on the built commit.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: |
          $h = (Get-FileHash dist\POUNCer.exe -Algorithm SHA256).Hash
          $a = (Get-FileHash dist\N1MMautostarter.exe -Algorithm SHA256).Hash
          $tk = if (Select-String -Path tk-test.txt -Pattern "skipped" -Quiet) { "skipped (no Tk display on the runner)" } else { "passed on a real Tk window" }
          $notes = "POUNCer $env:TAG - built by GitHub Actions run $env:GITHUB_RUN_ID with the PyInstaller bootloader compiled from source.`n`n**POUNCer.exe** SHA-256: ``$h```n`n**N1MMautostarter.exe** SHA-256: ``$a`` (for PCs without POUNCer: starts N1MM and your other programs)`n`nWindow layout test: $tk.`n`nPut POUNCer.exe and config.ini in the same folder; see CHANGELOG.md for what's new."
          # SHA256SUMS.txt: the updater installs only if this and GitHub's own
          # record of the file agree with the download (two checksums).
          $sums = foreach ($f in "POUNCer.exe", "N1MMautostarter.exe", "config.ini") {
            "{0}  {1}" -f (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower(), $f
          }
          [IO.File]::WriteAllText("dist\SHA256SUMS.txt", (($sums -join "`n") + "`n"))
          Get-Content dist\SHA256SUMS.txt
          gh release create "$env:TAG" dist\POUNCer.exe dist\config.ini dist\N1MMautostarter.exe dist\SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "POUNCer $env:TAG" --notes "$notes"

      - uses: actions/upload-artifact@v6
        with:
          name: POUNCer
          path: |
            dist/POUNCer.exe
            dist/config.ini
            dist/N1MMautostarter.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Tests
        run: |
          set +e
          python -m unittest discover -s tests -v 2> test-out.txt
          rc=$?
          cat test-out.txt
          # failing tests as annotations (readable without the full log)
          grep -E "^(ERROR|FAIL):" test-out.txt | head -10 | sed 's/^/::error::/'
          grep -E "^[A-Za-z]*(Error|Exception):|^AssertionError" test-out.txt | head -10 | sed 's/^/::error::/'
          exit $rc

      - name: Install PyInstaller (bootloader compiled from source)
        run: |
          python -m pip install certifi
          python -m pip install --no-binary pyinstaller "pyinstaller==$PYINSTALLER_VERSION"
          python -m PyInstaller --version

      - name: Build and smoke test
        run: |
          python -m PyInstaller --noconfirm POUNCer.spec
          cp config.ini dist/config.ini
          dist/POUNCer --help

      - name: Verify frozen HTTPS download
        run: python tests/smoke_macos_download.py dist/POUNCer

      - name: Package and SHA-256
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tar -czf "POUNCer-macos-$ARCH.tar.gz" -C dist POUNCer config.ini
          shasum -a 256 "POUNCer-macos-$ARCH.tar.gz" | tee "POUNCer-macos-$ARCH.tar.gz.sha256"
          cat "POUNCer-macos-$ARCH.tar.gz.sha256" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: POUNCer-macos-${{ matrix.arch }}
          path: POUNCer-macos-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  release-macos:
    # Wait for the Windows job to create the release before attaching assets.
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: POUNCer-macos-*
          merge-multiple: true
          path: release-assets

      - name: Attach macOS builds to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber
