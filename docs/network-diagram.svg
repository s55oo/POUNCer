<text class="h" x="482" y="1007" text-anchor="start">Other POUNCers (team)</text>
<text class="s" x="482" y="1027" text-anchor="start">&quot;hi&quot; every 2 s (cw / ssb / paused, bands)</text>
<text class="s" x="482" y="1043" text-anchor="start">master → &quot;spot&quot; (only it is connected)</text>
<text class="s" x="482" y="1059" text-anchor="start">master → &quot;self&quot; (SPOTTED) · &quot;update&quot;</text>
<text class="s" x="482" y="1075" text-anchor="start">&quot;src&quot; = the Spots choice · &quot;rh&quot; run history</text>
<text class="s" x="482" y="1091" text-anchor="start">optional team password (HMAC)</text>
<rect class="box" x="908" y="985" width="458" height="145" rx="10"/>
