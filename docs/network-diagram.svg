<text class="s" x="336" y="401" text-anchor="middle">spots out · DX / sh/dx → azure</text>
<rect class="box" x="32" y="460" width="390" height="92" rx="10"/>
<text class="h" x="44" y="482" text-anchor="start">Autostart (local, no network)</text>
<text class="s" x="44" y="502" text-anchor="start">POUNCer starts your programs (N1MM first).</text>
<text class="s" x="44" y="518" text-anchor="start">N1MMautostarter.exe on PCs without POUNCer:</text>
<text class="s" x="44" y="534" text-anchor="start">listens briefly on UDP 12060 for N1MM.</text>
<rect class="box" x="876" y="112" width="490" height="62" rx="10"/>
<text class="h" x="888" y="134" text-anchor="start">Reverse Beacon Network</text>
<text class="s" x="888" y="154" text-anchor="start">telnet.reversebeacon.net :7000 / :7001</text>
<text class="s" x="888" y="170" text-anchor="start">Spots &gt; RBN · login = your call</text>
<line class="t" x1="692" y1="134" x2="874" y2="134" marker-end="url(#aT)"/>
