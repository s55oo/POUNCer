<rect width="1400" height="1250" fill="#ffffff"/>
<text class="h" font-size="24" x="700" y="36" text-anchor="middle">POUNCer – network connections (v0.7.164)</text>
<text class="s" x="700" y="58" text-anchor="middle">ports are the defaults (config.ini) · no passwords: RBN and the clusters get your callsign only · details: docs/NETWORK.md</text>
