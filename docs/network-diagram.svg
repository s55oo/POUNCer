<text class="h" x="888" y="206" text-anchor="start">azure.s53m.com :8000 (S53ZO, node S50DXS)</text>
<text class="s" x="888" y="226" text-anchor="start">Spots &gt; Telnet: skimmer spots (-#, SNR)</text>
<text class="s" x="888" y="242" text-anchor="start">Spots &gt; Cluster: spots of people</text>
<text class="s" x="888" y="258" text-anchor="start">Telnet + Cluster = ONE login (your call); N1MM&#x27;s</text>
<text class="s" x="888" y="274" text-anchor="start">DX / commands go over it (Relay)</text>
<text class="s" x="888" y="290" text-anchor="start">TelBck: this server while RBN is down</text>
<text class="s" x="888" y="306" text-anchor="start">MyCall: login &lt;call&gt;-77, only spots of you</text>
<line class="t" x1="692" y1="206" x2="874" y2="206" marker-end="url(#aT)"/>
<text class="l t" x="782.0" y="199" text-anchor="middle">telnet 8000</text>
