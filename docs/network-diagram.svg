<text class="s" x="920" y="1027" text-anchor="start">→ this PC, TCP 10000 (cluster server)</text>
<text class="s" x="920" y="1043" text-anchor="start">gets the spots of the switched-on sources (Relay)</text>
<text class="s" x="920" y="1059" text-anchor="start">its DX / commands go over POUNCer&#x27;s azure login</text>
<text class="s" x="920" y="1075" text-anchor="start">File &gt; Allow POUNCer in Windows Firewall…</text>
