<rect class="box" x="32" y="112" width="200" height="320" rx="10"/>
<text class="h" x="44" y="134" text-anchor="start">N1MM Logger+</text>
<text class="s" x="44" y="154" text-anchor="start">Entry Window A / B</text>
<text class="s" x="44" y="170" text-anchor="start">log *.s3db</text>
