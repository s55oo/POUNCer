<text class="swb" x="454" y="274" text-anchor="start">Spots menu (each on/off):</text>
<text class="sw" x="454" y="291" text-anchor="start">RBN · Telnet · HTTP · Cluster</text>
<text class="sw" x="454" y="308" text-anchor="start">same spot twice = once</text>
<text class="sw" x="454" y="325" text-anchor="start">backups: TelBck · HamQTH</text>
<text class="sw" x="454" y="342" text-anchor="start"></text>
<text class="sw" x="454" y="359" text-anchor="start">Spotters: who spots</text>
<text class="sw" x="454" y="376" text-anchor="start">Spotted: which DX</text>
<text class="sw" x="454" y="393" text-anchor="start">Calls · DXCC · Zones · Cont · WW</text>
<text class="sw" x="454" y="410" text-anchor="start"></text>
<text class="sw" x="454" y="427" text-anchor="start">MyCall: spots of my call</text>
<text class="sw" x="454" y="444" text-anchor="start">Relay: spots out on 10000</text>
