<text class="h" x="888" y="352" text-anchor="start">azure.s53m.com  HTTPS /cors/rbn/live</text>
<text class="s" x="888" y="372" text-anchor="start">Spots &gt; HTTP: RBN skimmer spots as JSON</text>
